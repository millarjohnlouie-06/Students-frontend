<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Database Project</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #f9f9f9; }
        .card { background: white; border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; box-shadow: 2px 2px 5px rgba(0,0,0,0.05); }
        input, button { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { background-color: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0051a2; }
    </style>
</head>
<body>
    <h2>Add New Record</h2>
    <form id="dataForm">
        <input type="text" id="title" placeholder="Record Title (e.g., John Millar)" required>
        <input type="text" id="content" placeholder="Record Content (e.g., Present - Computer Networks)" required>
        <button type="submit">Submit to Database</button>
    </form>

    <h2>Database Records</h2>
    <div id="recordsContainer">Loading...</div>

    <script>
        // IMPORTANT: Replace this URL with your exact Vercel deployment URL ending with /api
        const VERCEL_API_URL = 'https://student-api-backend-dehh.vercel.app/api';

        // Function to fetch and display records
        async function loadRecords() {
            try {
                const response = await fetch(VERCEL_API_URL);
                const records = await response.json();
                const container = document.getElementById('recordsContainer');
                container.innerHTML = '';
                
                if (records.length === 0) {
                    container.innerHTML = '<p>No records found.</p>';
                    return;
                }

                records.forEach(record => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `<strong>${record.title || 'Untitled'}</strong><br>${record.content || ''}`;
                    container.appendChild(div);
                });
            } catch (error) {
                document.getElementById('recordsContainer').innerText = 'Error loading records.';
                console.error(error);
            }
        }

        // Function to handle form submission
        document.getElementById('dataForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;

            try {
                const response = await fetch(VERCEL_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content })
                });

                if (response.ok) {
                    // Clear form and reload records
                    document.getElementById('dataForm').reset();
                    loadRecords();
                } else {
                    alert('Failed to submit record.');
                }
            } catch (error) {
                alert('Failed to connect to backend API.');
                console.error(error);
            }
        });

        // Initial load
        loadRecords();
    </script>
</body>
</html>
