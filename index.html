<script>
    // Explicitly point to your live Vercel backend route
    const VERCEL_API_URL = 'https://student-backend-khaki.vercel.app/api/attendance';
    let attendanceDatabase = [];
    let currentInspectedDocId = "";

    // Automatically trigger when the document is fully ready
    document.addEventListener("DOMContentLoaded", function() {
        console.log("EduTrack Pro initialized. Fetching from MongoDB...");
        const today = new Date().toISOString().split('T')[0];
        const dateInput = document.getElementById('formDate');
        if (dateInput) dateInput.value = today;

        fetchAttendance();
    });

    async function fetchAttendance() {
        const statusEl = document.getElementById('dbStatusText');
        if (statusEl) statusEl.innerText = "Database Status: Connecting to Vercel/MongoDB Atlas...";

        try {
            console.log("Calling API:", VERCEL_API_URL);
            const response = await fetch(VERCEL_API_URL);
            const data = await response.json();
            
            console.log("Data received:", data);

            if (Array.isArray(data) && data.length > 0) {
                attendanceDatabase = data;
                currentInspectedDocId = attendanceDatabase[0]._id;
                if (statusEl) statusEl.innerText = "Database Status: Connected (MongoDB Atlas / Vercel Live)";
            } else {
                if (statusEl) statusEl.innerText = "Database Status: Connected (0 records returned)";
            }

            renderDashboard();
        } catch (error) {
            console.error('Error fetching attendance:', error);
            if (statusEl) statusEl.innerText = "Database Status: Connection Failed (Check Network Tab)";
            renderDashboard();
        }
    }

    function renderDashboard() {
        const subjectEl = document.getElementById('filterSubject');
        const sectionEl = document.getElementById('filterSection');
        const statusEl = document.getElementById('filterStatus');
        const searchEl = document.getElementById('searchInput');

        const subjectFilter = subjectEl ? subjectEl.value : 'ALL';
        const sectionFilter = sectionEl ? sectionEl.value : 'ALL';
        const statusFilter = statusEl ? statusEl.value : 'ALL';
        const searchKeyword = searchEl ? searchEl.value.toLowerCase().trim() : '';

        const dispSub = document.getElementById('displaySubject');
        const dispSec = document.getElementById('displaySection');
        if (dispSub) dispSub.innerText = subjectFilter === 'ALL' ? 'All Subjects' : subjectFilter;
        if (dispSec) dispSec.innerText = sectionFilter === 'ALL' ? 'All Sections' : sectionFilter;

        let filteredDocs = attendanceDatabase.filter(doc => {
            const matchSubject = subjectFilter === 'ALL' || (doc.subjectName && doc.subjectName.toLowerCase() === subjectFilter.toLowerCase());
            const matchSection = sectionFilter === 'ALL' || (doc.section && doc.section.toLowerCase() === sectionFilter.toLowerCase());
            const matchSearch = (doc.studentName || '').toLowerCase().includes(searchKeyword) || 
                                (doc.studentId || '').toLowerCase().includes(searchKeyword) ||
                                (doc.subjectName || '').toLowerCase().includes(searchKeyword);
            
            let matchStatus = true;
            if (statusFilter !== 'ALL' && Array.isArray(doc.attendance)) {
                matchStatus = doc.attendance.some(att => att.status === statusFilter);
            }

            return matchSubject && matchSection && matchSearch && matchStatus;
        });

        let totalPresent = 0, totalLate = 0, totalAbsent = 0, totalExcused = 0;
        
        filteredDocs.forEach(doc => {
            if (Array.isArray(doc.attendance)) {
                doc.attendance.forEach(log => {
                    if (log.status === 'Present') totalPresent++;
                    else if (log.status === 'Late') totalLate++;
                    else if (log.status === 'Absent') totalAbsent++;
                    else if (log.status === 'Excused') totalExcused++;
                });
            }
        });

        const totalLogs = totalPresent + totalLate + totalAbsent + totalExcused;
        const overallRate = totalLogs > 0 ? (((totalPresent + totalLate) / totalLogs) * 100).toFixed(1) : '0.0';

        const setVal = (id, val) => { const el = document.getElementById(id); if(el) el.innerText = val; };
        setVal('kpiPresent', totalPresent);
        setVal('kpiLate', totalLate);
        setVal('kpiAbsent', totalAbsent);
        setVal('kpiExcused', totalExcused);
        setVal('kpiRate', overallRate + '%');
        
        const rateBar = document.getElementById('kpiRateBar');
        if (rateBar) rateBar.style.width = overallRate + '%';
        
        setVal('recordCountBadge', filteredDocs.length + ' records');

        const tbody = document.getElementById('attendanceTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';

        const emptyState = document.getElementById('emptyState');

        if (filteredDocs.length === 0) {
            if (emptyState) emptyState.classList.remove('hidden');
            return;
        } else {
            if (emptyState) emptyState.classList.add('hidden');
        }

        filteredDocs.forEach(doc => {
            const attendanceArray = Array.isArray(doc.attendance) ? doc.attendance : [];
            const latestLog = attendanceArray[attendanceArray.length - 1] || { date: 'N/A', status: 'N/A', timeIn: '--', remarks: 'No logs' };
            const tr = document.createElement('tr');
            tr.className = "hover:bg-slate-800/40 transition-colors";

            const getBadge = (status) => {
                switch(status) {
                    case 'Present': return `<span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 inline-flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>Present</span>`;
                    case 'Late': return `<span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/30 inline-flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>Late</span>`;
                    case 'Absent': return `<span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/30 inline-flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>Absent</span>`;
                    case 'Excused': return `<span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/30 inline-flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-sky-400"></span>Excused</span>`;
                    default: return `<span class="px-2 py-0.5 rounded text-slate-500 bg-slate-800">None</span>`;
                }
            };

            const studentNameChar = doc.studentName ? doc.studentName.charAt(0) : '?';

            tr.innerHTML = `
                <td class="py-3.5 px-4">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center font-bold text-slate-300 font-mono text-xs border border-slate-700">
                            ${studentNameChar}
                        </div>
                        <div>
                            <div class="font-semibold text-white cursor-pointer hover:text-emerald-400 transition" onclick="openStudentDetailModal('${doc._id}')">${doc.studentName || 'Untitled'}</div>
                            <div class="text-[11px] font-mono text-slate-400">${doc.studentId || 'N/A'}</div>
                        </div>
                    </div>
                </td>
                <td class="py-3.5 px-4">
                    <div class="text-slate-200 font-medium">${doc.subjectName || 'Unspecified'}</div>
                    <div class="text-[11px] text-slate-400 font-mono">${doc.section || 'N/A'}</div>
                </td>
                <td class="py-3.5 px-4">
                    <div class="text-slate-300 font-mono text-[11px]">${latestLog.date} ${latestLog.timeIn ? '• ' + latestLog.timeIn : ''}</div>
                    <div class="text-[11px] text-slate-400 italic truncate max-w-[180px]">${latestLog.remarks || 'No remarks'}</div>
                </td>
                <td class="py-3.5 px-4 text-center">
                    <span class="px-2 py-1 rounded bg-slate-800 border border-slate-700 font-mono text-slate-300 text-[11px]">
                        ${attendanceArray.length} sessions
                    </span>
                </td>
                <td class="py-3.5 px-4 text-center">
                    ${getBadge(latestLog.status)}
                </td>
                <td class="py-3.5 px-4 text-right">
                    <div class="flex items-center justify-end gap-1.5">
                        <button onclick="openStudentDetailModal('${doc._id}')" title="View Full History" class="p-1.5 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-md transition">
                            <i class="fa-solid fa-clock-rotate-left text-xs"></i>
                        </button>
                        <button onclick="openEditModal('${doc._id}')" title="Add / Update Record" class="p-1.5 text-emerald-400 hover:text-emerald-300 bg-emerald-500/10 hover:bg-emerald-500/20 rounded-md transition">
                            <i class="fa-solid fa-pen-to-square text-xs"></i>
                        </button>
                        <button onclick="inspectDocument('${doc._id}')" title="View Mongo BSON JSON" class="p-1.5 text-teal-400 hover:text-teal-300 bg-teal-500/10 hover:bg-teal-500/20 rounded-md transition">
                            <i class="fa-solid fa-code text-xs"></i>
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function applyFilters() { renderDashboard(); }
    function inspectDocument(id) { currentInspectedDocId = id; openSchemaModal(); }

    function openSchemaModal() {
        const doc = attendanceDatabase.find(d => d._id === currentInspectedDocId) || attendanceDatabase[0];
        if (!doc) return;
        const jsonPre = document.getElementById('jsonContent');
        const formattedBson = {
            _id: `ObjectId('${doc._id}')`,
            studentId: doc.studentId,
            studentName: doc.studentName,
            subjectName: doc.subjectName,
            section: doc.section,
            attendance: (doc.attendance || []).map(a => ({
                date: a.date, status: a.status, timeIn: a.timeIn || '09:00 AM', remarks: a.remarks || ''
            }))
        };
        if (jsonPre) jsonPre.innerText = JSON.stringify(formattedBson, null, 2);
        const modal = document.getElementById('schemaModal');
        if (modal) modal.classList.remove('hidden');
    }

    function closeSchemaModal() { 
        const modal = document.getElementById('schemaModal');
        if (modal) modal.classList.add('hidden'); 
    }

    function copyJsonToClipboard() {
        const doc = attendanceDatabase.find(d => d._id === currentInspectedDocId) || attendanceDatabase[0];
        if (!doc) return;
        navigator.clipboard.writeText(JSON.stringify(doc, null, 2));
        const copyBtnText = document.getElementById('copyBtnText');
        if (copyBtnText) copyBtnText.innerText = 'Copied!';
        setTimeout(() => { if (copyBtnText) copyBtnText.innerText = 'Copy Raw JSON'; }, 2000);
        showToast("MongoDB Object copied to clipboard!");
    }

    function openAddAttendanceModal() {
        const titleEl = document.getElementById('modalFormTitle');
        if (titleEl) titleEl.innerText = 'Mark / Add Attendance Log';
        const setVal = (id, val) => { const el = document.getElementById(id); if(el) el.value = val; };
        setVal('formDocId', '');
        setVal('formStudentId', '');
        setVal('formStudentName', '');
        setVal('formSubjectName', '');
        setVal('formSection', '');
        setVal('formRemarks', '');
        setVal('formTime', new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
        const modal = document.getElementById('addAttendanceModal');
        if (modal) modal.classList.remove('hidden');
    }

    function openEditModal(id) {
        const doc = attendanceDatabase.find(d => d._id === id);
        if(!doc) return;
        const titleEl = document.getElementById('modalFormTitle');
        if (titleEl) titleEl.innerText = 'Update Student Record';
        const setVal = (id, val) => { const el = document.getElementById(id); if(el) el.value = val; };
        setVal('formDocId', doc._id);
        setVal('formStudentId', doc.studentId || '');
        setVal('formStudentName', doc.studentName || '');
        setVal('formSubjectName', doc.subjectName || '');
        setVal('formSection', doc.section || '');
        setVal('formTime', new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
        setVal('formRemarks', 'Updated log entry');
        const modal = document.getElementById('addAttendanceModal');
        if (modal) modal.classList.remove('hidden');
    }

    function closeAddAttendanceModal() { 
        const modal = document.getElementById('addAttendanceModal');
        if (modal) modal.classList.add('hidden'); 
    }

    async function handleFormSubmit(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn) submitBtn.innerText = "Saving to MongoDB...";

        const getVal = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
        const studentId = getVal('formStudentId');
        const studentName = getVal('formStudentName');
        const subjectName = getVal('formSubjectName');
        const section = getVal('formSection');
        const date = getVal('formDate');
        const status = getVal('formStatus');
        const timeIn = getVal('formTime') || '09:00 AM';
        const remarks = getVal('formRemarks') || 'Added via portal';

        const payload = {
            studentId,
            studentName,
            subjectName,
            section,
            attendance: [{ date, status, timeIn, remarks }]
        };

        try {
            const response = await fetch(VERCEL_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                showToast(`Successfully saved ${studentName} to MongoDB!`);
                closeAddAttendanceModal();
                await fetchAttendance();
            } else {
                const errData = await response.json().catch(() => ({}));
                alert(`Server error: ${errData.message || 'Failed to save record.'}`);
            }
        } catch (error) {
            console.error('Error saving to MongoDB:', error);
            alert('Connection error. Could not reach Vercel API.');
        } finally {
            if (submitBtn) submitBtn.innerText = "Save Record";
        }
    }

    function openStudentDetailModal(id) {
        const doc = attendanceDatabase.find(d => d._id === id);
        if (!doc) return;
        const setTxt = (id, val) => { const el = document.getElementById(id); if(el) el.innerText = val; };
        setTxt('sdName', doc.studentName || 'Untitled');
        setTxt('sdId', doc.studentId || 'N/A');
        setTxt('sdCourse', `${doc.subjectName || 'Unspecified'} • Section ${doc.section || 'N/A'}`);
        setTxt('sdObjectId', `_id: ObjectId('${doc._id}')`);
        
        const attendanceArray = Array.isArray(doc.attendance) ? doc.attendance : [];
        setTxt('sdArrayCount', attendanceArray.length);

        let p = 0, l = 0, a = 0, e = 0;
        attendanceArray.forEach(log => {
            if(log.status==='Present') p++;
            else if(log.status==='Late') l++;
            else if(log.status==='Absent') a++;
            else if(log.status==='Excused') e++;
        });

        setTxt('sdPresent', p);
        setTxt('sdLate', l);
        setTxt('sdAbsent', a);
        setTxt('sdExcused', e);

        const timeline = document.getElementById('sdTimeline');
        if (timeline) {
            timeline.innerHTML = '';
            attendanceArray.slice().reverse().forEach((log, index) => {
                const item = document.createElement('div');
                item.className = "p-3 rounded-xl bg-slate-900/80 border border-slate-800 flex items-center justify-between text-xs";
                let badgeColor = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                if(log.status==='Late') badgeColor = "bg-amber-500/10 text-amber-400 border-amber-500/20";
                if(log.status==='Absent') badgeColor = "bg-rose-500/10 text-rose-400 border-rose-500/20";
                if(log.status==='Excused') badgeColor = "bg-sky-500/10 text-sky-400 border-sky-500/20";

                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="font-mono text-slate-500 text-[10px]">#${attendanceArray.length - index}</span>
                        <div>
                            <div class="font-semibold text-slate-200">${log.date} ${log.timeIn ? '<span class="text-slate-400 font-normal">(' + log.timeIn + ')</span>' : ''}</div>
                            <div class="text-[11px] text-slate-400 italic">${log.remarks || 'No notes added'}</div>
                        </div>
                    </div>
                    <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold border ${badgeColor}">${log.status}</span>
                `;
                timeline.appendChild(item);
            });
        }
        const modal = document.getElementById('studentDetailModal');
        if (modal) modal.classList.remove('hidden');
    }

    function closeStudentDetailModal() { 
        const modal = document.getElementById('studentDetailModal');
        if (modal) modal.classList.add('hidden'); 
    }

    function exportCSV() {
        let csvRows = [["ObjectId", "StudentID", "StudentName", "SubjectName", "Section", "Date", "Status", "TimeIn", "Remarks"]];
        attendanceDatabase.forEach(doc => {
            if (Array.isArray(doc.attendance)) {
                doc.attendance.forEach(log => {
                    csvRows.push([
                        `"${doc._id}"`, `"${doc.studentId || ''}"`, `"${doc.studentName || ''}"`, `"${doc.subjectName || ''}"`,
                        `"${doc.section || ''}"`, `"${log.date || ''}"`, `"${log.status || ''}"`, `"${log.timeIn || ''}"`, `"${log.remarks || ''}"`
                    ]);
                });
            }
        });
        const csvContent = "data:text/csv;charset=utf-8," + csvRows.map(e => e.join(",")).join("\n");
        const link = document.createElement("a");
        link.setAttribute("href", encodeURI(csvContent));
        link.setAttribute("download", `attendance_export_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("CSV Attendance Report downloaded successfully!");
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        if (!toast || !toastMsg) return;
        toastMsg.innerText = message;
        toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
        setTimeout(() => {
            toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
        }, 3000);
    }
</script>
